services:
  - type: web
    name: emergency-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB
        value: tudun_wada_emergency
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        sync: false
